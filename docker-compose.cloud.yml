# 闲鱼智控 —— 云服务器部署配置（拉取预构建镜像 + Nginx 反代）
#
# 与另外三份 compose 的分工：
#   docker-compose.yml      本机/开发，本地 build 镜像
#   docker-compose-cn.yml   同上，但 apt/pip/npm/Chromium 走国内源
#   docker-compose.nas.yml  NAS 图形界面用，无 .env、无 Nginx
#   本文件                  云服务器：不构建 + 只回环暴露应用端口 + Nginx 对外
#
# 为什么云上不要本地构建：Dockerfile 要在机器上跑 npm ci + vite build +
# pip 编译 + 下载 Chromium，2~4 G 内存的云服务器会在这一步被打满甚至 OOM
# （见 docs/deployment.md「部署失败排查」第 1、2 条）。预构建镜像压缩后 0.67 GB。
#
# 内存怎么填（应用容器上限，主机还要留 400~500 M 给系统和 dockerd）：
#   实测：空载容器 183 M；起一次有头 Chromium 验证会话后稳定 999 M（其中 409 M 是可
#   回收 page cache，真正不可回收约 551 M），过程峰值 1182 M；硬限 1536 M 跑通、无 OOM。
#   2 GiB 主机：MEMORY_LIMIT=1536M + 必须加 swap，且这台机器不要再放别的服务
#   4 GiB 主机：MEMORY_LIMIT=2816M —— 注意实机 free -h 只报 3.5 GiB（云厂商预留），
#              给 3072M 等于占满物理内存，留 768 MiB 给系统与 dockerd 周转
#   两种规格都必须加 2 G swap：阿里云 Ubuntu 镜像默认 Swap 0B，实测确认
#   测的是普通网页，真实闲鱼滑块页更重 —— 上面的数按下限看
#
# 启动：
#   cp .env.cloud.example .env   # 至少改掉 ADMIN_PASSWORD
#   docker compose -f docker-compose.cloud.yml up -d
#   docker compose -f docker-compose.cloud.yml ps   # 等到 healthy

services:
  xianyu-app:
    # 这个镜像由上游作者那条 main 的 docker-publish.yml 构建；origin 是别人的仓库、不往里推，
    # 所以它不会因为你本地补齐而变完整。2026-09-25 实测 latest 里缺
    # app/delivery_template.py、app/services/notification_test.py 与
    # app/routers/logistics_*.py，uvicorn 在 import 阶段就失败，容器永远 unhealthy、
    # Nginx 因 depends_on healthy 不启动 —— 靠下面三段挂载把本地补齐的文件覆盖进去。
    # ghcr 在国内云主机上可能拉不动，用 APP_IMAGE 换成转推后的地址，不必改本文件。
    image: ${APP_IMAGE:-ghcr.io/23star/xianyu-super-butler:latest}
    container_name: xianyu-super-butler
    restart: unless-stopped
    # 只绑回环：公网流量必须经下面的 Nginx，避免后台带着默认口令 admin/admin123
    # 直接暴露在互联网上被扫。需要在公网直连 8080 调试时，删掉这里的 "127.0.0.1:"。
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./backups:/app/backups:rw
      # 运行期没有任何代码路径回写它（app/config.py 的 Config.save() 零调用），
      # 后台改的配置落在 SQLite 里，所以这里只读挂载是安全的。
      - ./global_config.yml:/app/global_config.yml:ro
      # 镜像里缺这三个文件，用本地这份覆盖。服务器上这三个路径必须真实存在
      # （补齐的提交只在本机，origin 是上游作者的仓库、不往里推，用 git archive 送过去；
      # 缺文件时 Docker 会建一个同名空目录，报错变成难读的 IsADirectoryError）。
      # 单文件 bind mount 锁的是 inode：覆盖后必须 up -d --force-recreate，
      # 只 restart 容器仍看着旧文件。
      # 版本核对：docker exec xianyu-super-butler wc -l /app/app/reply_server.py
      # 与本地只差 13 行（就是这份 try/except 降级补丁）即为同一条 main 线。
      - ./app/delivery_template.py:/app/app/delivery_template.py:ro
      - ./app/services/notification_test.py:/app/app/services/notification_test.py:ro
      - ./app/reply_server.py:/app/app/reply_server.py:ro
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      DB_PATH: "${DB_PATH:-/app/data/xianyu_data.db}"
      # 后端的监听地址与端口取自 global_config.yml 的 AUTO_REPLY.api.host/port
      # （Start.py:694），环境变量优先级更高。这里显式钉死，是因为挂载进去的
      # global_config.yml 只要写着 127.0.0.1 或非 8080 端口，容器里的健康检查
      # 就会一直失败、Nginx 因 depends_on healthy 而永不启动。
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      # 仅首次建库时用来初始化管理员密码；库已存在时改这里无效，请在后台改。
      # 依据 app/db_manager.py:1271。
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      SQL_LOG_ENABLED: "${SQL_LOG_ENABLED:-false}"
      SQL_LOG_LEVEL: "${SQL_LOG_LEVEL:-WARNING}"
      # 云服务器上 socket 取到的是 172.x 容器内网地址，日志里那句人工验证提示
      # 会指向打不开的地址。填公网 IP 或域名（utils/item_search.py:88）。
      SERVER_HOST: "${SERVER_HOST:-}"
      # 后台「人工验证」按钮不受上面这项影响：它按 location.host 走同源
      # （frontend/components/AccountList.tsx:254），经 Nginx 正常访问。
      XVFB_SCREEN: "${XVFB_SCREEN:-1920x1080x24}"
    networks:
      - xianyu-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Chromium 与 Playwright 首次解包较慢，60s 容易被判不健康。
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: "${MEMORY_LIMIT:-1536M}"
          cpus: "${CPU_LIMIT:-2.0}"
        reservations:
          memory: "${MEMORY_RESERVATION:-512M}"
          cpus: "${CPU_RESERVATION:-0.5}"
    # 不限制的话 Docker 会把 stdout 无限写进 /var/lib/docker/containers/*.log，
    # 与 ./logs 各算一份，是 40 G 磁盘最常见的隐性占用。
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: xianyu-super-butler-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.cloud.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      xianyu-app:
        condition: service_healthy
    networks:
      - xianyu-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

networks:
  xianyu-network:
    driver: bridge
