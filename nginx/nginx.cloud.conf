events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WebSocket 升级需要按请求决定要不要带 Connection: close，
    # 写死 'upgrade' 会让普通请求也被当成升级请求处理。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 商品配图批量上传走这个入口，上游默认 10M 会卡在 413。
    client_max_body_size 30M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    upstream xianyu_backend {
        server xianyu-app:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # 人工滑块验证投屏：服务器持续推截图、浏览器回传鼠标事件，
        # 空闲几十秒很正常。上游配置的 proxy_read_timeout 30s 会在拖动
        # 中途掐断连接，弹窗白屏后只能重来，而账号仍在风控冷却里。
        location /api/captcha/ws/ {
            proxy_pass http://xianyu_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # 其余接口同样要能升级（前端还有别的长连接时不必逐个加 location）
        location /api/ {
            proxy_pass http://xianyu_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location /health {
            proxy_pass http://xianyu_backend/health;
            access_log off;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            proxy_pass http://xianyu_backend;
            expires 7d;
            add_header Cache-Control "public";
        }

        location / {
            proxy_pass http://xianyu_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ------------------------------------------------------------------
    # HTTPS：有域名和证书后，把下面整段取消注释，并把上面的 location 块
    # 复制进去（或改成先做 location 公共片段再 include）。
    #
    # 自签/云厂商证书：把 fullchain.pem 与 privkey.pem 放进 ./nginx/ssl/
    # 签 Let's Encrypt（需域名 A 记录指向本机，80 端口保持可访问）：
    #   docker run --rm -p 80:80 -v $PWD/nginx/ssl:/etc/letsencrypt \
    #     acme/shell "certbot certonly --standalone -d butler.example.com"
    #   cp -r /etc/letsencrypt/live/butler.example.com/* nginx/ssl/
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name butler.example.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:MozTLS:10m;
    #     ssl_session_tickets off;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #
    #     # ...同上 location 块...
    # }
    #
    # 启用后把上面的 server 块改成只跳转：
    #   return 301 https://$host$request_uri;
    # ------------------------------------------------------------------
}
